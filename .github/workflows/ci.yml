name: CI Checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    name: Run static checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        # Always resolve the newest 1.26.x patch release. Without this,
        # setup-go may use a stale (up to 24h) version manifest and install a
        # patch release that still contains standard-library advisories, which
        # makes the govulncheck step fail (e.g. GO-2026-6859 fixed in 1.26.11).
        check-latest: true

    - name: Go version
      run: go version

    - uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-tools

    - name: Setup tools
      run: make get_tools

    - name: Run Makefile checks
      run: make checks

  tests:
    name: Run Go ${{ matrix.go }} tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.27", "1.26"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          # See the checks job: always take the newest patch release.
          check-latest: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-build-

      - name: Build
        run: go build $(go list ./... | grep -v /go_sdk)

      - name: Run Makefile tests
        run: make test
